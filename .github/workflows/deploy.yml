name: Deploy Story Island from Verified Sources

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out frontend and source manifest
        uses: actions/checkout@v4
      - name: Restore and verify the complete static site
        run: python3 restore-site.py --out _site
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload the verified site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: '1800000'
